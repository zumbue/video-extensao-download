<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Extensão Download</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon32.png" width="28" height="28" alt="">
      <div>
        <h1>Video Extensão Download</h1>
        <p>Link, rede, qualidade e nome</p>
      </div>
    </div>
    <p id="service" class="service" role="status">em espera</p>
  </header>

  <form id="form">
    <label class="field">
      <span>Link</span>
      <span class="row">
        <input id="url" type="url" inputmode="url" placeholder="Cole qualquer link http ou https" autocomplete="off" spellcheck="false" aria-describedby="page-link">
        <button id="use-tab" class="ghost" type="button">Aba</button>
      </span>
      <small id="page-link" hidden>Link da página aberta.</small>
    </label>

    <div class="field">
      <span>Rede</span>
      <p id="network" class="chip">Aguardando link</p>
    </div>

    <fieldset class="field">
      <legend>Qualidade</legend>
      <div id="qualities" class="choices" role="group" aria-label="Qualidade do vídeo"></div>
    </fieldset>

    <fieldset id="trim" class="field" hidden>
      <legend>Trecho</legend>
      <div class="trim-times">
        <label>
          <span>Início</span>
          <input id="trim-start" type="text" placeholder="0:00.00" autocomplete="off" spellcheck="false" aria-describedby="trim-meta">
        </label>
        <label>
          <span>Fim</span>
          <input id="trim-end" type="text" placeholder="fim" autocomplete="off" spellcheck="false" aria-describedby="trim-meta">
        </label>
      </div>
      <div id="trim-bar" class="trim-bar" hidden>
        <div class="trim-track"></div>
        <div id="trim-fill" class="trim-fill"></div>
        <button id="trim-start-handle" class="trim-handle" type="button" role="slider" aria-label="Início do trecho" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"></button>
        <button id="trim-end-handle" class="trim-handle" type="button" role="slider" aria-label="Fim do trecho" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"></button>
      </div>
      <small id="trim-meta"><span id="trim-spinner" class="spinner" hidden aria-hidden="true"></span><span id="trim-meta-text">Vazio baixa o vídeo inteiro.</span></small>
    </fieldset>

    <label class="field">
      <span class="label-row">
        Nome
        <button id="rename" class="text" type="button">Atualizar horário</button>
      </span>
      <span class="name-row">
        <input id="filename" type="text" maxlength="80" autocomplete="off" spellcheck="false" aria-describedby="name-help">
        <code id="ext">.mp4</code>
      </span>
      <small id="name-help">Automático pela rede, data e hora. Dá para editar.</small>
    </label>

    <label class="check">
      <input id="compress" type="checkbox">
      <span>Formato compactado (ZIP)</span>
    </label>

    <p id="banner" class="banner" hidden></p>
    <div id="progress-wrap" class="progress-wrap" hidden>
      <div class="progress" aria-hidden="true"><div id="bar"></div></div>
      <span id="progress-label">0%</span>
    </div>

    <div class="actions">
      <button id="download" class="primary" type="submit" disabled>Baixar</button>
      <div class="side-actions">
        <button id="downloads-toggle" class="ghost" type="button" aria-expanded="false" aria-controls="downloads-panel">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M8 2.2v6.2M5.4 6.1 8 8.8l2.6-2.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3.2 10.2V12a1 1 0 0 0 1 1h7.6a1 1 0 0 0 1-1v-1.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Downloads
        </button>
        <button id="open-folder" class="ghost" type="button" disabled>Abrir pasta</button>
      </div>
    </div>
    <section id="downloads-panel" class="downloads" hidden>
      <div id="downloads-live" class="download-live" hidden>
        <strong id="downloads-live-title">Baixando</strong>
        <span id="downloads-live-meta"></span>
        <div class="mini-bar" aria-hidden="true"><div id="downloads-live-bar"></div></div>
      </div>
      <p class="downloads-label">Concluídos</p>
      <ul id="downloads-list"></ul>
      <p id="downloads-empty" class="empty">Nenhum arquivo ainda.</p>
    </section>
  </form>

  <footer>
    <p id="hint">Os arquivos vão para a pasta Downloads.</p>
  </footer>

  <script src="detect.js"></script>
  <script src="popup.js"></script>
</body>
</html>

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empacota e publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/package_extension.py
          gh release create "$GITHUB_REF_NAME" dist/video-extensao-download.zip \
            --title "Video Extensão Download ${GITHUB_REF_NAME#v}" \
            --notes "Extraia o ZIP e dê dois cliques em Instalar. A extensão inicia o serviço ao colar um link e ele se encerra sozinho depois do download. O botão Abrir pasta mostra o arquivo no gerenciador."
